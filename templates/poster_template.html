<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{POSTER_TITLE}}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans SC', sans-serif;
      background: #0a0a0f;
    }
    .poster {
      width: 1080px;
      height: 1920px;
      background: linear-gradient(135deg, #0a0a0f 0%, #12121a 50%, #0d0d14 100%);
      position: relative;
      overflow: hidden;
    }
    .glow {
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.35;
    }
    .glow-1 { width: 600px; height: 600px; background: {{COLOR_1}}; top: -200px; right: -150px; }
    .glow-2 { width: 500px; height: 500px; background: {{COLOR_2}}; bottom: 200px; left: -150px; }
    .glow-3 { width: 400px; height: 400px; background: {{COLOR_3}}; bottom: -100px; right: -100px; }
    .code-font { font-family: 'JetBrains Mono', monospace; }
    .accent-text {
      background: linear-gradient(135deg, {{GRADIENT_START}} 0%, {{GRADIENT_MID}} 50%, {{GRADIENT_END}} 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
    }
    .divider {
      height: 2px;
      background: linear-gradient(90deg, transparent 0%, {{COLOR_1}} 50%, transparent 100%);
    }
    .tag {
      background: {{TAG_BG}};
      border: 1px solid {{TAG_BORDER}};
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen py-8">
  <div class="poster p-14 flex flex-col">
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>
    <div class="glow glow-3"></div>

    <!-- 顶部 -->
    <div class="relative z-10 flex items-center justify-between mb-8">
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 rounded-xl bg-gradient-to-br {{LOGO_GRADIENT}} flex items-center justify-center">
          <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
          </svg>
        </div>
        <span class="text-white/70 text-xl font-medium tracking-wider">TECH SHARE</span>
      </div>
      <span class="code-font text-white/40 text-lg">{{DATE}}</span>
    </div>

    <!-- 标题区 -->
    <div class="relative z-10 mb-6">
      <div class="inline-block px-4 py-1.5 rounded-full {{BADGE_BG}} border {{BADGE_BORDER}} mb-4">
        <span class="code-font {{BADGE_TEXT_COLOR}} text-base font-semibold tracking-wide">{{CATEGORY}}</span>
      </div>
      <h1 class="text-7xl font-black text-white leading-tight mb-5">{{TITLE_LINE1}}<span class="accent-text">{{TITLE_HIGHLIGHT}}</span>{{TITLE_LINE2}}</h1>
      <p class="text-xl text-white/60 font-medium leading-relaxed">{{SUBTITLE}}</p>
    </div>

    <div class="relative z-10 divider my-2"></div>

    <!-- 核心观点 -->
    <div class="relative z-10 card rounded-3xl p-6 my-4">
      <div class="flex items-start gap-5">
        <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-amber-500 to-orange-600 flex items-center justify-center flex-shrink-0">
          <svg class="w-9 h-9 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/>
          </svg>
        </div>
        <div>
          <h2 class="text-2xl font-bold text-white/90 mb-3">核心观点</h2>
          <p class="text-3xl font-bold text-white leading-relaxed">{{CORE_INSIGHT}}</p>
        </div>
      </div>
    </div>

    <!-- 技术原理 -->
    <div class="relative z-10 card rounded-3xl p-6 my-4">
      <h2 class="text-2xl font-bold text-white/90 mb-3 flex items-center gap-3">
        <span class="w-2 h-8 bg-gradient-to-b {{SECTION_BAR_GRADIENT}} rounded-full"></span>
        技术原理
      </h2>
      <p class="text-xl text-white/80 leading-relaxed mb-4">{{PRINCIPLE_TEXT}}</p>
      <img src="{{DIAGRAM_PATH}}" alt="技术原理流程图" class="w-full rounded-2xl" style="max-height:400px; object-fit:contain">
    </div>

    <!-- 技术价值分析 -->
    <div class="relative z-10 card rounded-2xl p-5 my-3">
      <h2 class="text-2xl font-bold text-white/90 mb-3 flex items-center gap-3">
        <span class="w-2 h-8 bg-gradient-to-b {{SECTION_BAR_GRADIENT}} rounded-full"></span>
        技术价值分析
      </h2>
      <ul class="space-y-3">
        {{VALUE_POINTS}}
      </ul>
    </div>

    <!-- 适用场景 -->
    <div class="relative z-10 card rounded-2xl p-5 my-3">
      <h2 class="text-xl font-bold text-white/90 mb-2">💡 适合谁看 / 什么时候用</h2>
      <p class="text-lg text-white/70 leading-relaxed">{{AUDIENCE}}</p>
    </div>

    <!-- 标签和底部 -->
    <div class="relative z-10 mt-auto">
      <div class="flex flex-wrap gap-3 mb-4">
        {{TAGS}}
      </div>
      <div class="flex items-center justify-between pt-6 border-t border-white/10">
        <div>
          <p class="text-white/50 text-base mb-1">文章来源</p>
          <p class="text-white/80 text-xl font-semibold">{{SOURCE}}</p>
          <p class="text-white/40 text-sm mt-2 mb-1">{{SOURCE_NOTE}}</p>
          <p class="code-font text-white/50 text-sm break-all">{{ARTICLE_URL}}</p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
